name: Publish NuGet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-packages.yml'
      - 'Sudzekai.WebOs.Core/**'
      - 'Sudzekai.WebOs.Hosting/**'
      - 'Sudzekai.WebOs.Plugin/**'

jobs:
  publish:
    name: Build & Push Sudzekai.WebOs.* packages
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Clean packages
        shell: pwsh
        run: |
          if (Test-Path ./packages) { Remove-Item ./packages -Recurse -Force }
          New-Item -ItemType Directory -Path ./packages | Out-Null

      - name: Pack Sudzekai.WebOs.* only
        shell: pwsh
        run: |
          $projects = @(
            "Sudzekai.WebOs.Core/Sudzekai.WebOs.Core.csproj",
            "Sudzekai.WebOs.Hosting/Sudzekai.WebOs.Hosting.csproj",
            "Sudzekai.WebOs.Plugin/Sudzekai.WebOs.Plugin.csproj"
          )
          foreach ($p in $projects) {
            if (-not (Test-Path $p)) { throw "Project not found: $p" }
            dotnet pack $p -c Release --no-build -o ./packages
          }

      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: sudzekai

      - name: Publish to NuGet
        shell: pwsh
        run: |
          $packages = (Get-ChildItem ./packages/*.nupkg).FullName
          if (-not $packages) { throw "No .nupkg files found in ./packages" }
          Write-Host "Pushing packages:"
          $packages | ForEach-Object { Write-Host "  $_" }
          dotnet nuget push $packages --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

