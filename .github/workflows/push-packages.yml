name: Push NuGet Packages

on:
  push:
    branches: [main]
    paths:
      - 'Sudzekai.WebOs.Core/**'
      - 'Sudzekai.WebOs.Hosting/**'
      - 'Sudzekai.WebOs.Plugin/**'

jobs:
  publish:
    name: Build & Push Sudzekai.WebOs.* packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build projects
        run: |
          dotnet build Sudzekai.WebOs.Core/Sudzekai.WebOs.Core.csproj --configuration Release --no-restore
          dotnet build Sudzekai.WebOs.Hosting/Sudzekai.WebOs.Hosting.csproj --configuration Release --no-restore
          dotnet build Sudzekai.WebOs.Plugin/Sudzekai.WebOs.Plugin.csproj --configuration Release --no-restore

      - name: Collect nupkg artifacts
        run: |
          Write-Host "Collecting NuGet packages..."
          $packages = Get-ChildItem -Path "./**/*.nupkg" -Recurse -File
          foreach ($pkg in $packages) {
            Write-Host "Found: $($pkg.FullName)"
          }
